[build-system]
requires = ["uv_build>=0.13.7,<0.14"]
build-backend = "uv_build"

[project]
name = "toyml"
version = "0.4.0"
description = "ToyML: Machine Learning from Scratch"
keywords = ["machine learning", "statistics", "engineering"]
license = "Apache-2.0"
license-files = ["LICENSE"]
readme = "README.md"
authors = [{ name = "Xiangzhuang Shen", email = "shenxiangzhuang@gmail.com" }]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Programming Language :: Python :: Implementation :: CPython",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Mathematics",
]
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
plot = ["matplotlib>=3.9", "networkx>=3.3", "numpy>=2.1.1", "scipy>=1.14"]

[project.urls]
Homepage = "https://github.com/ai-glimpse/toyml"
"Bug Tracker" = "https://github.com/ai-glimpse/toyml/issues"
Documentation = "https://ai-glimpse.github.io/toyml/"
"Source Code" = "https://github.com/ai-glimpse/toyml"
"Release Notes" = "https://github.com/ai-glimpse/toyml/releases"

[dependency-groups]
dev = ["prek>=0.5.10", { include-group = "lint" }, { include-group = "test" }]
lint = ["ruff>=0.17.3", "ty>=0.0.96"]
test = [
    "hypothesis>=6.112.0",
    "matplotlib>=3.9",
    "networkx>=3.3",
    "numpy>=2.1.1",
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "scikit-learn>=1.5",
    "scipy>=1.14",
]
docs = ["zensical>=0.0.74", "mkdocstrings-python>=2.0.10", "pymdown-extensions>=12.3"]

[tool.uv.build-backend]
module-root = ""
source-include = ["tests/**", "examples/**"]

[tool.ty.src]
include = ["toyml", "tests", "examples"]

[tool.ty.rules]
dynamic-function-decorator-return = "error"
missing-type-argument = "error"
possibly-unresolved-reference = "warn"
unsound-return-statement = "error"
unused-ignore-comment = "warn"

[tool.pytest.ini_options]
addopts = "--doctest-modules --cov=toyml --cov-report=term-missing"
testpaths = ["toyml", "tests"]

[tool.coverage.report]
exclude_also = [
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "def __repr__",
]
fail_under = 90
precision = 1
skip_empty = true
sort = "-Cover"

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = [
    "ANN", "B", "C4", "D", "E", "EM", "F", "FA", "I", "ICN", "INT",
    "NPY", "PERF", "PIE", "PT", "PTH", "PYI", "SIM", "TRY", "UP", "W",
]
ignore = ["D100", "D101", "D102", "D103", "D104", "D105", "D107"]
pydocstyle = { convention = "google" }

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["PT009"]

[tool.ruff.format]
docstring-code-format = true

[project]
site_name = "ToyML"
site_url = "https://ai-glimpse.github.io/toyml/"
site_description = "Machine Learning from Scratch"
site_author = "Xiangzhuang Shen"
repo_url = "https://github.com/ai-glimpse/toyml"
repo_name = "ai-glimpse/toyml"
edit_uri = "edit/master/docs/"
copyright = "Copyright &copy; 2017–2026 Xiangzhuang Shen"
exclude_docs = "abbreviations.md"
extra_css = ["css/extra.css"]
extra_javascript = ["js/config.js", "https://cdn.jsdelivr.net/npm/mathjax@3.2.2/es5/tex-mml-chtml.js"]
nav = [
    { Home = "index.md" },
    { Algorithms = [
        { Clustering = [
            { "K-means" = "algorithms/clustering/kmeans.md" },
            { "Bisecting K-means" = "algorithms/clustering/bisecting_kmeans.md" },
            { AGNES = "algorithms/clustering/agnes.md" },
            { DBSCAN = "algorithms/clustering/dbscan.md" },
        ] },
        { Classification = [
            { KNN = "algorithms/classification/knn.md" },
            { "Naive Bayes" = "algorithms/classification/naive_bayes.md" },
        ] },
        { Ensemble = [
            { AdaBoost = "algorithms/ensemble/adaboost.md" },
            { "Isolation Forest" = "algorithms/ensemble/isolation_forest.md" },
        ] },
    ] },
    { Releases = "https://github.com/ai-glimpse/toyml/releases" },
]

[project.theme]
variant = "modern"
language = "en"
features = [
    "content.code.copy", "content.action.edit", "content.action.view",
    "content.code.annotate", "content.tooltips", "navigation.indexes",
    "navigation.sections", "navigation.tabs", "navigation.top",
    "navigation.tracking", "search.highlight", "toc.follow",
]

[project.theme.icon]
repo = "fontawesome/brands/github"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
primary = "teal"
accent = "deep purple"
toggle = { icon = "material/weather-sunny", name = "Switch to dark mode" }

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
primary = "cyan"
accent = "deep purple"
toggle = { icon = "material/weather-night", name = "Switch to light mode" }

[[project.extra.social]]
icon = "fontawesome/brands/github"
link = "https://github.com/ai-glimpse/toyml"

[[project.extra.social]]
icon = "fontawesome/brands/linkedin"
link = "https://www.linkedin.com/in/xiangzhuang-shen-a81825157/"

[project.markdown_extensions]
abbr = {}
admonition = {}
attr_list = {}
def_list = {}
footnotes = {}
tables = {}
toc = { permalink = true }
"pymdownx.arithmatex" = { generic = true }
"pymdownx.details" = {}
"pymdownx.highlight" = { linenums_style = "pymdownx.inline" }
"pymdownx.inlinehilite" = {}
"pymdownx.snippets" = { auto_append = ["docs/abbreviations.md"] }
"pymdownx.superfences" = {}
"pymdownx.tabbed" = { alternate_style = true }
"pymdownx.tasklist" = { custom_checkbox = true }

[project.plugins.search]

[project.plugins.autorefs]

[project.plugins.mkdocstrings.handlers.python]
paths = ["src"]

[project.plugins.mkdocstrings.handlers.python.options]
docstring_style = "google"
docstring_options = { ignore_init_summary = true }
docstring_section_style = "spacy"
show_docstring_classes = true
show_docstring_attributes = true
heading_level = 2
members_order = "source"
merge_init_into_class = true
separate_signature = true
show_root_heading = false
show_root_full_path = true
show_signature_annotations = true
signature_crossrefs = true
show_root_members_full_path = true
show_root_toc_entry = true
show_symbol_type_heading = true
show_symbol_type_toc = true
